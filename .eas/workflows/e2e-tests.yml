# Maestro E2E on EAS: builds the e2e-test profile for Android (APK) and iOS (simulator),
# then runs the Phase 1 flows. Triggered by adding the `e2e` label to a pull request into main.
# Run on demand: npx eas-cli@latest workflow:run .eas/workflows/e2e-tests.yml
name: E2E tests (Maestro)

on:
  pull_request_labeled:
    labels: ['e2e']
    if: ${{ github.event.pull_request.base.ref == 'main' }}

jobs:
  build_android:
    name: Build Android (e2e-test)
    type: build
    params:
      platform: android
      profile: e2e-test

  build_ios:
    name: Build iOS simulator (e2e-test)
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_android:
    name: Maestro (Android)
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/onboarding_demo.yaml
        - .maestro/add_expense.yaml
        - .maestro/transfer.yaml
        - .maestro/delete_undo.yaml
      retries: 1

  maestro_ios:
    name: Maestro (iOS)
    needs: [build_ios]
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/onboarding_demo.yaml
        - .maestro/add_expense.yaml
        - .maestro/transfer.yaml
        - .maestro/delete_undo.yaml
      retries: 1
